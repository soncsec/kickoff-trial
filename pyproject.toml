[project]
name = "kickoff-trial"
version = "0.1.0"
description = "A small localhost to-do list HTTP API."
authors = [
    { name = "soncsec", email = "343279853+soncsec@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, S: security (bandit rules), UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert on purpose.
"tests/**" = ["S101"]

[tool.uv]
# Supply-chain cooldown: ignore releases younger than 7 days. Malicious package
# versions are usually caught and pulled within days of publishing.
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
